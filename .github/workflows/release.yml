name: Release

on:
  push:
    tags:
      # Minecraft-mod versions: 1.21.1-0.1.0 / v1.21.1-0.1.0(-prerelease)
      - "[0-9]+.[0-9]+.[0-9]+-[0-9]+.[0-9]+.[0-9]+"
      - "[0-9]+.[0-9]+.[0-9]+-[0-9]+.[0-9]+.[0-9]+-*"
      - "v[0-9]+.[0-9]+.[0-9]+-[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+-[0-9]+.[0-9]+.[0-9]+-*"
      # Mod-only tags (Minecraft version taken from gradle.properties)
      - "[0-9]+.[0-9]+.[0-9]+"
      - "[0-9]+.[0-9]+.[0-9]+-*"
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+-*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version as Minecraft-mod (e.g. 1.21.1-0.1.0) or mod-only (e.g. 0.1.0). Leave empty to use mod_version from gradle.properties."
        required: false
        type: string

permissions:
  contents: write
  models: read

jobs:
  # Tag pushes can land before the tagged commit is on main (e.g. push tag from a PR
  # branch). Only release when the commit is already on origin/main.
  guard:
    runs-on: ubuntu-latest
    outputs:
      proceed: ${{ steps.decide.outputs.proceed }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Require main
        id: decide
        run: |
          set -euo pipefail

          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            if [[ "${{ github.ref }}" != "refs/heads/main" ]]; then
              echo "workflow_dispatch must run from main (got ${{ github.ref }}); skipping"
              echo "proceed=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "proceed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git fetch origin main
          if git merge-base --is-ancestor "${{ github.sha }}" origin/main; then
            echo "Tag ${{ github.ref_name }} commit ${{ github.sha }} is on origin/main"
            echo "proceed=true" >> "$GITHUB_OUTPUT"
          else
            echo "Tag ${{ github.ref_name }} commit ${{ github.sha }} is not on origin/main; skipping release"
            echo "proceed=false" >> "$GITHUB_OUTPUT"
          fi

  release:
    needs: guard
    if: needs.guard.outputs.proceed == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Resolve version
        id: version
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            RAW="${{ inputs.version }}"
            if [[ -z "$RAW" ]]; then
              RAW="$(grep -E '^mod_version=' gradle.properties | cut -d= -f2- | tr -d '[:space:]')"
            fi
          else
            RAW="${GITHUB_REF_NAME}"
          fi

          VERSION="${RAW#v}"
          MC_FROM_PROPS="$(grep -E '^minecraft_version=' gradle.properties | cut -d= -f2- | tr -d '[:space:]')"
          PRERELEASE=false

          # Preferred: {minecraft}-{mod} e.g. 1.21.1-0.1.0 or 1.21.1-0.1.0-beta.1
          if [[ "$VERSION" =~ ^([0-9]+\.[0-9]+\.[0-9]+)-([0-9]+\.[0-9]+\.[0-9]+)(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
            MINECRAFT="${BASH_REMATCH[1]}"
            MOD_VERSION="${BASH_REMATCH[2]}${BASH_REMATCH[3]}${BASH_REMATCH[4]}"
            FULL_VERSION="$VERSION"
            if [[ -n "${BASH_REMATCH[3]}" ]]; then
              PRERELEASE=true
            fi
          # Fallback: mod-only semver; prepend minecraft_version from gradle.properties
          elif [[ "$VERSION" =~ ^([0-9]+\.[0-9]+\.[0-9]+)(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
            if [[ -z "$MC_FROM_PROPS" ]]; then
              echo "minecraft_version is missing from gradle.properties"
              exit 1
            fi
            MINECRAFT="$MC_FROM_PROPS"
            MOD_VERSION="$VERSION"
            FULL_VERSION="${MINECRAFT}-${MOD_VERSION}"
            if [[ -n "${BASH_REMATCH[2]}" ]]; then
              PRERELEASE=true
            fi
          else
            echo "Resolved '$RAW' is not a valid release version (expected 1.21.1-0.1.0 or 0.1.0)"
            exit 1
          fi

          if [[ "${{ github.event_name }}" == "push" ]]; then
            TAG="${GITHUB_REF_NAME}"
          else
            TAG="v${FULL_VERSION}"
          fi

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$FULL_VERSION" >> "$GITHUB_OUTPUT"
          echo "mod_version=$MOD_VERSION" >> "$GITHUB_OUTPUT"
          echo "minecraft_version=$MINECRAFT" >> "$GITHUB_OUTPUT"
          echo "prerelease=$PRERELEASE" >> "$GITHUB_OUTPUT"
          echo "Building release $FULL_VERSION (tag $TAG, Minecraft $MINECRAFT, mod $MOD_VERSION, prerelease=$PRERELEASE)"

      - name: Sync mod_version from release version
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          sed -i "s/^mod_version=.*/mod_version=${VERSION}/" gradle.properties
          grep -E '^mod_version=' gradle.properties

      - name: Build Fabric and NeoForge jars
        run: ./gradlew :fabric:remapJar :forge:remapJar --no-daemon --stacktrace -Pmod_version=${{ steps.version.outputs.version }}

      - name: Collect release artifacts
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          mkdir -p release
          cp "fabric/build/libs/precast-structure-${VERSION}.jar" \
            "release/precast-structure-${VERSION}-fabric.jar"
          cp "forge/build/libs/precast-structure-${VERSION}.jar" \
            "release/precast-structure-${VERSION}-neoforge.jar"
          ls -la release/

      - name: Generate AI release notes
        id: notes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CURRENT_TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          git fetch --tags --force

          python <<'PY'
          import json
          import os
          import subprocess
          import textwrap
          import urllib.request

          current_tag = os.environ["CURRENT_TAG"]
          repository = os.environ["GITHUB_REPOSITORY"]
          github_token = os.environ["GITHUB_TOKEN"]

          def git(*args):
              return subprocess.check_output(["git", *args], text=True)

          releases_req = urllib.request.Request(
              f"https://api.github.com/repos/{repository}/releases",
              headers={
                  "Authorization": f"Bearer {github_token}",
                  "Accept": "application/vnd.github+json",
                  "X-GitHub-Api-Version": "2022-11-28",
              },
          )
          with urllib.request.urlopen(releases_req) as response:
              releases = json.loads(response.read().decode("utf-8"))

          previous_tag = next(
              (
                  release["tag_name"]
                  for release in releases
                  if not release.get("draft") and release.get("tag_name") != current_tag
              ),
              "",
          )
          base_ref = previous_tag or git("rev-list", "--max-parents=0", "HEAD").strip()

          commit_log = git(
              "log",
              "--no-merges",
              "--format=%h %s",
              f"{base_ref}..HEAD",
              "--",
              "common/src/main",
              "fabric/src/main",
              "forge/src/main",
          ).strip()

          diff_stat = git(
              "diff",
              "--stat",
              f"{base_ref}..HEAD",
              "--",
              "common/src/main",
              "fabric/src/main",
              "forge/src/main",
          ).strip()

          diff_patch = git(
              "diff",
              "--unified=1",
              "--no-color",
              f"{base_ref}..HEAD",
              "--",
              "common/src/main",
              "fabric/src/main",
              "forge/src/main",
          )

          max_patch_chars = 120000
          if len(diff_patch) > max_patch_chars:
              diff_patch = diff_patch[:max_patch_chars] + "\n\n[diff truncated]\n"

          system_prompt = textwrap.dedent(
              """
              You are writing player-facing Minecraft mod release notes.
              Focus only on changes that affect actual gameplay, player experience,
              compatibility that players will notice, crash fixes, UI behavior,
              placement/scanning/printing behavior, rendering, or loader-specific
              fixes that unblock real usage.

              Exclude CI, workflows, tests, refactors, code cleanup, comments,
              dependency maintenance, internal architecture changes, and anything
              that does not affect how players use the mod.

              Do not mention pull requests, issue numbers, commit hashes, branch
              names, or repository process. Do not say "PR" or "issue".

              Output Markdown only in this format:
              ## What's Changed
              - bullet
              - bullet

              Use 1-6 concise bullets. If the changes are only internal and there
              are no player-visible changes, output exactly:
              ## What's Changed
              - No player-facing gameplay changes in this release.
              """
          ).strip()

          user_prompt = textwrap.dedent(
              f"""
              Current release tag: {current_tag}
              Compare from: {base_ref}
              Compare to: HEAD

              Commit subjects:
              {commit_log or "(none)"}

              Diff stat:
              {diff_stat or "(none)"}

              Relevant source diff:
              {diff_patch or "(none)"}
              """
          ).strip()

          payload = {
              "model": "openai/gpt-4.1",
              "temperature": 0.2,
              "messages": [
                  {"role": "system", "content": system_prompt},
                  {"role": "user", "content": user_prompt},
              ],
          }

          req = urllib.request.Request(
              "https://models.github.ai/inference/chat/completions",
              data=json.dumps(payload).encode("utf-8"),
              headers={
                  "Authorization": f"Bearer {os.environ['GITHUB_TOKEN']}",
                  "Content-Type": "application/json",
                  "Accept": "application/vnd.github+json",
                  "X-GitHub-Api-Version": "2022-11-28",
              },
              method="POST",
          )

          with urllib.request.urlopen(req) as response:
              body = json.loads(response.read().decode("utf-8"))

          content = body["choices"][0]["message"]["content"].strip()
          if not content:
              raise SystemExit("AI release notes were empty")

          with open("release-notes.md", "w", encoding="utf-8") as fh:
              fh.write(content)
              fh.write("\n")
          PY

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: Pre-cast Structure ${{ steps.version.outputs.version }}
          body_path: release-notes.md
          prerelease: ${{ steps.version.outputs.prerelease == 'true' }}
          files: |
            release/precast-structure-*-fabric.jar
            release/precast-structure-*-neoforge.jar
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish Fabric to Modrinth
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          # Base62 project id (required while the project is under review / slug is not public)
          modrinth-id: ynJKnqKN
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          name: Pre-cast Structure ${{ steps.version.outputs.version }} (Fabric)
          version: ${{ steps.version.outputs.version }}+fabric
          version-type: ${{ steps.version.outputs.prerelease == 'true' && 'beta' || 'release' }}
          changelog-file: release-notes.md
          files: release/precast-structure-*-fabric.jar
          loaders: fabric
          game-versions: ${{ steps.version.outputs.minecraft_version }}
          java: "21"
          dependencies: |
            architectury-api(required){modrinth:lhGA9TYQ}
            cloth-config(required){modrinth:9s6osm5g}
            fabric-api(optional){modrinth:P7dR8mSH}
            create(optional){modrinth:LNytGWDc}
            sable(optional){modrinth:T9PomCSv}

      - name: Publish NeoForge to Modrinth
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          # Base62 project id (required while the project is under review / slug is not public)
          modrinth-id: ynJKnqKN
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          name: Pre-cast Structure ${{ steps.version.outputs.version }} (NeoForge)
          version: ${{ steps.version.outputs.version }}+neoforge
          version-type: ${{ steps.version.outputs.prerelease == 'true' && 'beta' || 'release' }}
          changelog-file: release-notes.md
          files: release/precast-structure-*-neoforge.jar
          loaders: neoforge
          game-versions: ${{ steps.version.outputs.minecraft_version }}
          java: "21"
          dependencies: |
            architectury-api(required){modrinth:lhGA9TYQ}
            cloth-config(required){modrinth:9s6osm5g}
            create(optional){modrinth:LNytGWDc}
            sable(optional){modrinth:T9PomCSv}
